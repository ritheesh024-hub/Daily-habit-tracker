<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Daily Habits</title>
    <meta name="theme-color" content="#18181b" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="A simple 1-page daily habit tracker with Google authentication and history." />
    <meta property="og:title" content="Daily Habits" />
    <meta property="og:description" content="A simple 1-page daily habit tracker with Google authentication and history." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var activeUid = localStorage.getItem('dh_cache_active_uid');
          var saved = (activeUid && localStorage.getItem('dh_cache_theme_' + activeUid)) || localStorage.getItem('dh_theme_pref') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
